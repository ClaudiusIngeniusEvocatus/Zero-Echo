#
# Zero Echo — a journal of working notes
#

# Site identity
name: Zero Echo
title: Zero Echo
tagline: A journal of working notes
description: A personal journal of working notes — strategy, scenarios, mission command, contingency, and the cognitive habits in between.

# Author identity (the publication is Zero Echo; the author is Ant Sharman)
author:
  name: Ant Sharman
  url: https://www.linkedin.com/in/antsharman

social:
  name: Ant Sharman
  links:
    - https://www.linkedin.com/in/antsharman
    - https://bsky.app/profile/antsharman.bsky.social
# avatar: (left blank for now — small logo or headshot can go here later)

# Footer
footer-links:
  email: mailbox@evocatus.co.uk

# Site URL — used for sitemap.xml and RSS feed
url: https://zeroecho.uk
baseurl: ""

#
# Build settings below — preserving George's working configuration
#

permalink: /:title/
version: v1.2.0

# Markdown processing
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Sass
sass:
  style: :expanded

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# Files excluded from build
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME

# Pagination
paginate: 8
paginate_path: "/posts/page:num/"

# Defaults — OG image will be added later when we have a Zero Echo asset
# defaults:
#   - scope:
#       path: ""
#     values:
       image: /images/og-default.png